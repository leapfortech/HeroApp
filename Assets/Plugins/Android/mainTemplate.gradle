apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'androidx.appcompat:appcompat:1.8.0' // Packages/com.lefortech.core.security/Editor/Authentication/AndroidAuth/BioAuthDependencies.xml:8
    implementation 'androidx.biometric:biometric:1.1.0' // Packages/com.lefortech.core.security/Editor/Authentication/AndroidAuth/BioAuthDependencies.xml:10
    implementation 'com.google.android.gms:play-services-base:18.10.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/AppDependencies.xml:20
    implementation 'com.google.code.gson:gson:2.14.0' // Packages/com.lefortech.core.security/Editor/Authentication/AndroidAuth/BioAuthDependencies.xml:12
    implementation 'com.google.firebase:firebase-analytics:23.2.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/MessagingDependencies.xml:18
    implementation 'com.google.firebase:firebase-app-unity:13.15.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/AppDependencies.xml:26
    implementation 'com.google.firebase:firebase-auth:24.2.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/AuthDependencies.xml:16
    implementation 'com.google.firebase:firebase-auth-unity:13.15.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/AuthDependencies.xml:24
    implementation 'com.google.firebase:firebase-common:22.2.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/AppDependencies.xml:16
    implementation 'com.google.firebase:firebase-iid:21.1.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/MessagingDependencies.xml:20
    implementation 'com.google.firebase:firebase-messaging:25.1.1' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/MessagingDependencies.xml:16
    implementation 'com.google.firebase:firebase-messaging-unity:13.15.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/MessagingDependencies.xml:28
    implementation 'com.google.flatbuffers:flatbuffers-java:1.12.0' // Packages/com.lefortech.data.web/Runtime/Firebase/Editor/MessagingDependencies.xml:22
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
  packaging {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    compileSdk **APIVERSION**
    buildToolsVersion = "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
